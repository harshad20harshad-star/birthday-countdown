<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Countdown</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7d6dc;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #fbeaec;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    h1 {
      margin-bottom: 10px;
    }
    .name {
      color: #e6396c;
      font-size: 28px;
      font-weight: bold;
    }
    .timer {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }
    .box {
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      width: 70px;
    }
    .num {
      font-size: 26px;
      font-weight: bold;
      color: #e6396c;
    }
    .label {
      font-size: 12px;
    }
    .btn {
      background: #e6396c;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }
    .date {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Counting down to</h1>
    <div class="name">Harshad's Birthday 🎂</div>

    <div class="timer">
      <div class="box">
        <div class="num" id="days">00</div>
        <div class="label">Days</div>
      </div>
      <div class="box">
        <div class="num" id="hours">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="box">
        <div class="num" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="box">
        <div class="num" id="seconds">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <button class="btn">🎉 Let’s Celebrate</button>
    <div class="date">Birthdate: 01 / 05 / 2004</div>
  </div>

  <script>
    function getNextBirthday() {
      const now = new Date();
      let year = now.getFullYear();
      let birthday = new Date(`May 1, ${year} 00:00:00`);

      if (now > birthday) {
        birthday = new Date(`May 1, ${year + 1} 00:00:00`);
      }
      return birthday.getTime();
    }

    setInterval(() => {
      const now = new Date().getTime();
      const diff = getNextBirthday() - now;

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = d;
      document.getElementById("hours").innerText = h;
      document.getElementById("minutes").innerText = m;
      document.getElementById("seconds").innerText = s;
    }, 1000);
  </script>

</body>
</html>
